<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1120" viewBox="0 0 1500 1120" role="img" aria-labelledby="title desc">
  <title id="title">Database Relation Graph</title>
  <desc id="desc">Entity relationship diagram for the rag_ingestion PostgreSQL control-plane schema.</desc>
  <defs>
    <style>
      .bg { fill: #f7f9fc; }
      .table { fill: #ffffff; stroke: #cfd8e6; stroke-width: 2; rx: 16; ry: 16; }
      .head { fill: #1f3a6d; }
      .headText { font: 700 22px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
      .label { font: 700 15px 'Segoe UI', Arial, sans-serif; fill: #1f2a44; }
      .field { font: 400 14px Consolas, 'Courier New', monospace; fill: #30405a; }
      .pk { fill: #e7f7ec; stroke: #82b596; }
      .fk { fill: #eef4ff; stroke: #89a8df; }
      .note { font: 400 14px 'Segoe UI', Arial, sans-serif; fill: #5d6b86; }
      .title { font: 700 34px 'Segoe UI', Arial, sans-serif; fill: #1f2a44; }
      .subtitle { font: 400 16px 'Segoe UI', Arial, sans-serif; fill: #5d6b86; }
      .edge { stroke: #657895; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .edgeSoft { stroke: #8c9bb3; stroke-width: 2.5; fill: none; marker-end: url(#arrowSoft); }
      .legend { fill: #ffffff; stroke: #cfd8e6; stroke-width: 1.5; rx: 12; ry: 12; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L8,3.5 z" fill="#657895"/>
    </marker>
    <marker id="arrowSoft" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L8,3.5 z" fill="#8c9bb3"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1500" height="1120"/>

  <text class="title" x="60" y="70">PostgreSQL Table Relation Graph</text>
  <text class="subtitle" x="60" y="102">Schema: `rag_ingestion` control-plane database. Source of truth for document lifecycle, artifacts, chunks, runs, and validation events.</text>

  <g transform="translate(60,150)">
    <rect class="table" width="420" height="315"/>
    <rect class="head" width="420" height="54" rx="16" ry="16"/>
    <text class="headText" x="24" y="35">documents</text>
    <rect class="pk" x="18" y="72" width="384" height="30" rx="8" ry="8"/>
    <text class="field" x="28" y="92">PK  document_id TEXT</text>
    <text class="field" x="28" y="126">UQ  source_path TEXT</text>
    <text class="field" x="28" y="150">    file_name TEXT</text>
    <text class="field" x="28" y="174">    file_type TEXT CHECK ('pdf','docx')</text>
    <text class="field" x="28" y="198">    checksum TEXT</text>
    <text class="field" x="28" y="222">    document_type TEXT</text>
    <text class="field" x="28" y="246">    version TEXT</text>
    <text class="field" x="28" y="270">    status TEXT</text>
    <text class="field" x="28" y="294">    parser_name / parser_version</text>
    <text class="field" x="28" y="318">    collection_name / error_message</text>
    <text class="field" x="28" y="342">    metadata_json JSONB</text>
    <text class="field" x="28" y="366">    created_at / updated_at / indexed_at</text>
  </g>

  <g transform="translate(560,150)">
    <rect class="table" width="390" height="260"/>
    <rect class="head" width="390" height="54" rx="16" ry="16"/>
    <text class="headText" x="24" y="35">document_versions</text>
    <rect class="pk" x="18" y="72" width="354" height="30" rx="8" ry="8"/>
    <text class="field" x="28" y="92">PK  version_id BIGSERIAL</text>
    <rect class="fk" x="18" y="110" width="354" height="30" rx="8" ry="8"/>
    <text class="field" x="28" y="130">FK  document_id → documents.document_id</text>
    <text class="field" x="28" y="164">    version_label TEXT</text>
    <text class="field" x="28" y="188">    source_hash TEXT</text>
    <text class="field" x="28" y="212">    parser_name / parser_version</text>
    <text class="field" x="28" y="236">    status TEXT / is_current BOOLEAN</text>
    <text class="field" x="28" y="260">    metadata_json JSONB</text>
    <text class="field" x="28" y="284">    created_at TIMESTAMPTZ</text>
    <text class="field" x="28" y="308">UQ  (document_id, source_hash)</text>
  </g>

  <g transform="translate(1030,150)">
    <rect class="table" width="390" height="240"/>
    <rect class="head" width="390" height="54" rx="16" ry="16"/>
    <text class="headText" x="24" y="35">artifacts</text>
    <rect class="pk" x="18" y="72" width="354" height="30" rx="8" ry="8"/>
    <text class="field" x="28" y="92">PK  artifact_id BIGSERIAL</text>
    <rect class="fk" x="18" y="110" width="354" height="30" rx="8" ry="8"/>
    <text class="field" x="28" y="130">FK  document_id → documents.document_id</text>
    <text class="field" x="28" y="164">    artifact_type TEXT</text>
    <text class="field" x="28" y="188">    artifact_path TEXT</text>
    <text class="field" x="28" y="212">    artifact_meta JSONB</text>
    <text class="field" x="28" y="236">    artifact_summary JSONB</text>
    <text class="field" x="28" y="260">    created_at TIMESTAMPTZ</text>
    <text class="field" x="28" y="284">UQ  (document_id, artifact_type)</text>
  </g>

  <g transform="translate(220,560)">
    <rect class="table" width="390" height="265"/>
    <rect class="head" width="390" height="54" rx="16" ry="16"/>
    <text class="headText" x="24" y="35">chunks</text>
    <rect class="pk" x="18" y="72" width="354" height="30" rx="8" ry="8"/>
    <text class="field" x="28" y="92">PK  chunk_id TEXT</text>
    <rect class="fk" x="18" y="110" width="354" height="30" rx="8" ry="8"/>
    <text class="field" x="28" y="130">FK  document_id → documents.document_id</text>
    <text class="field" x="28" y="164">    chunk_index INTEGER</text>
    <text class="field" x="28" y="188">    section_path TEXT</text>
    <text class="field" x="28" y="212">    page_start / page_end INTEGER</text>
    <text class="field" x="28" y="236">    text_preview TEXT</text>
    <text class="field" x="28" y="260">    source_block_ids JSONB</text>
    <text class="field" x="28" y="284">    metadata_json JSONB</text>
    <text class="field" x="28" y="308">    created_at / indexed_at</text>
    <text class="field" x="28" y="332">UQ  (document_id, chunk_index)</text>
  </g>

  <g transform="translate(720,560)">
    <rect class="table" width="390" height="235"/>
    <rect class="head" width="390" height="54" rx="16" ry="16"/>
    <text class="headText" x="24" y="35">processing_runs</text>
    <rect class="pk" x="18" y="72" width="354" height="30" rx="8" ry="8"/>
    <text class="field" x="28" y="92">PK  run_id BIGSERIAL</text>
    <rect class="fk" x="18" y="110" width="354" height="30" rx="8" ry="8"/>
    <text class="field" x="28" y="130">FK  document_id → documents.document_id</text>
    <text class="field" x="28" y="164">    run_status TEXT</text>
    <text class="field" x="28" y="188">    parser_name / parser_version</text>
    <text class="field" x="28" y="212">    validation_summary JSONB</text>
    <text class="field" x="28" y="236">    created_at TIMESTAMPTZ</text>
  </g>

  <g transform="translate(1110,560)">
    <rect class="table" width="330" height="270"/>
    <rect class="head" width="330" height="54" rx="16" ry="16"/>
    <text class="headText" x="24" y="35">validation_events</text>
    <rect class="pk" x="18" y="72" width="294" height="30" rx="8" ry="8"/>
    <text class="field" x="28" y="92">PK  event_id BIGSERIAL</text>
    <rect class="fk" x="18" y="110" width="294" height="30" rx="8" ry="8"/>
    <text class="field" x="28" y="130">FK  document_id → documents.document_id</text>
    <rect class="fk" x="18" y="148" width="294" height="30" rx="8" ry="8"/>
    <text class="field" x="28" y="168">FK  run_id → processing_runs.run_id</text>
    <text class="field" x="28" y="202">    severity TEXT</text>
    <text class="field" x="28" y="226">    event_code TEXT</text>
    <text class="field" x="28" y="250">    event_message TEXT</text>
    <text class="field" x="28" y="274">    event_meta JSONB</text>
    <text class="field" x="28" y="298">    created_at TIMESTAMPTZ</text>
  </g>

  <path class="edge" d="M480 280 C520 280, 520 280, 560 280"/>
  <path class="edge" d="M480 320 C740 320, 760 250, 1030 250"/>
  <path class="edge" d="M270 465 C270 520, 320 520, 320 560"/>
  <path class="edge" d="M430 465 C650 465, 760 500, 850 560"/>
  <path class="edge" d="M480 360 C890 360, 1080 470, 1210 560"/>
  <path class="edgeSoft" d="M1110 680 C1080 680, 1080 680, 1110 680"/>
  <path class="edgeSoft" d="M1120 678 C1140 678, 1140 678, 1110 678"/>
  <path class="edge" d="M1110 710 C1090 710, 1090 710, 1110 710"/>
  <path class="edgeSoft" d="M1110 708 C1060 708, 1045 708, 1110 708"/>
  <path class="edge" d="M1110 695 C1090 695, 1085 695, 1110 695"/>

  <path class="edgeSoft" d="M1110 695 C1060 695, 1040 695, 930 695"/>

  <rect class="legend" x="60" y="920" width="1380" height="150"/>
  <text class="label" x="84" y="958">Relationship semantics</text>
  <rect class="pk" x="84" y="980" width="170" height="28" rx="8" ry="8"/>
  <text class="field" x="96" y="999">Primary key field</text>
  <rect class="fk" x="290" y="980" width="195" height="28" rx="8" ry="8"/>
  <text class="field" x="302" y="999">Foreign key field</text>
  <text class="note" x="84" y="1038">`documents` is the parent table. Deleting a document cascades to `document_versions`, `artifacts`, `chunks`, and `processing_runs`.</text>
  <text class="note" x="84" y="1064">`validation_events.run_id` is nullable and uses `ON DELETE SET NULL`, so event history can survive if a run row is removed.</text>
  <text class="note" x="84" y="1090">Control-plane only: full chunk text lives in artifacts / ChromaDB, while PostgreSQL stores traceable metadata and lifecycle state.</text>
</svg>
