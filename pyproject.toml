[project]
name = "rag-ingestion"
version = "0.1.0"
description = "Local PDF/DOCX ingestion pipeline with PostgreSQL tracking and ChromaDB retrieval verification."
requires-python = ">=3.11"
dependencies = [
    "chromadb==0.5.23",
    "psycopg[binary]==3.2.9",
    "pydantic==2.10.4",
    "pymupdf==1.24.14",
    "python-docx==1.1.2",
    "sentence-transformers==3.3.1",
    "streamlit==1.41.1",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
